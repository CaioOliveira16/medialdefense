<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Medieval Defense</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #1a1a24;
            color: #fff;
            display: flex;
            height: 100vh;
            overflow: hidden;
        }

        #game-container {
            flex: 1;
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: #0f0f15;
        }

        canvas {
            border: 2px solid #333;
            box-shadow: 0 0 20px rgba(0,0,0,0.8);
            background-color: #2e5a1c;
        }

        #ui-panel {
            width: 360px;
            background-color: #12121a;
            border-left: 2px solid #2a2a3a;
            display: flex;
            flex-direction: column;
            padding: 15px;
            gap: 15px;
            overflow-y: auto;
        }

        .header {
            text-align: center;
            padding-bottom: 10px;
            border-bottom: 1px solid #333;
        }

        .header h1 {
            font-size: 22px;
            color: #f59e0b;
            letter-spacing: 1px;
            text-shadow: 0 2px 4px rgba(0,0,0,0.5);
        }

        .stats-bar {
            display: flex;
            justify-content: space-between;
            background: #1e1e2d;
            padding: 10px 15px;
            border-radius: 8px;
            font-weight: bold;
            font-size: 14px;
        }

        .stat-item {
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .shop-title {
            font-size: 14px;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: #888;
        }

        .shop-grid {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .unit-card {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: #181824;
            border: 2px solid #333;
            border-radius: 8px;
            padding: 8px 12px;
            cursor: pointer;
            transition: all 0.2s ease;
            position: relative;
            overflow: hidden;
        }

        .unit-card:hover {
            transform: translateY(-2px);
            filter: brightness(1.2);
        }

        .unit-card.selected {
            border-color: #ffffff !important;
            box-shadow: 0 0 10px rgba(255, 255, 255, 0.4);
        }

        .unit-info {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .unit-icon {
            font-size: 24px;
            width: 36px;
            height: 36px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: rgba(0,0,0,0.3);
            border-radius: 6px;
        }

        .unit-details {
            display: flex;
            flex-direction: column;
        }

        .unit-name {
            font-weight: bold;
            font-size: 14px;
        }

        .unit-stats {
            font-size: 11px;
            color: #aaa;
        }

        .unit-price {
            font-weight: bold;
            color: #10b981;
            font-size: 14px;
        }

        /* Raridades */
        .rarity-comum { border-color: #808080; }
        .rarity-comum .unit-name { color: #808080; }

        .rarity-incomum { border-color: #22c55e; }
        .rarity-incomum .unit-name { color: #22c55e; }

        .rarity-raro { border-color: #3b82f6; }
        .rarity-raro .unit-name { color: #3b82f6; }

        .rarity-epico { border-color: #a855f7; }
        .rarity-epico .unit-name { color: #a855f7; }

        .rarity-lendario { border-color: #eab308; }
        .rarity-lendario .unit-name { color: #eab308; }

        .rarity-mitico {
            border-image: linear-gradient(45deg, red, orange, yellow, green, blue, indigo, violet) 1;
            animation: rainbow-border 3s linear infinite;
        }
        .rarity-mitico .unit-name {
            background: linear-gradient(45deg, red, orange, yellow, green, blue, indigo, violet);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .rarity-secreto { border-color: #dc2626; background: linear-gradient(135deg, #181824 0%, #2a0808 100%); }
        .rarity-secreto .unit-name { color: #dc2626; text-shadow: 0 0 5px rgba(220, 38, 38, 0.5); }

        @keyframes rainbow-border {
            0% { filter: hue-rotate(0deg); }
            100% { filter: hue-rotate(360deg); }
        }

        .controls {
            margin-top: auto;
            display: flex;
            gap: 10px;
        }

        .btn {
            flex: 1;
            padding: 12px;
            border: none;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.2s;
            text-align: center;
        }

        .btn-wave {
            background: #ef4444;
            color: white;
        }
        .btn-wave:hover { background: #dc2626; }

        .btn-cancel {
            background: #4b5563;
            color: white;
        }
        .btn-cancel:hover { background: #374151; }
    </style>
</head>
<body>

    <div id="game-container">
        <canvas id="gameCanvas" width="800" height="600"></canvas>
    </div>

    <div id="ui-panel">
        <div class="header">
            <h1>MEDIEVAL DEFENSE</h1>
        </div>

        <div class="stats-bar">
            <div class="stat-item">💰 <span id="gold-display">600</span></div>
            <div class="stat-item">❤️ <span id="lives-display">20</span></div>
            <div class="stat-item">⚔️ Rodada <span id="wave-display">1</span></div>
        </div>

        <div class="shop-title">Unidades Disponíveis</div>

        <div class="shop-grid" id="shop-container"></div>

        <div class="controls">
            <button class="btn btn-cancel" id="btn-cancel">Cancelar</button>
            <button class="btn btn-wave" id="btn-wave">Próxima Onda</button>
        </div>
    </div>

    <script>
        const UNITS = {
            campones: { id: 'campones', name: 'Camponês', rarity: 'comum', cost: 50, damage: 2, cooldown: 1.0, range: 50, icon: '👨‍🌾' },
            bardo: { id: 'bardo', name: 'Bardo', rarity: 'incomum', cost: 150, damage: 0, cooldown: 1.0, range: 100, icon: '🪕', aura: 0.1 },
            cavaleiro: { id: 'cavaleiro', name: 'Cavaleiro', rarity: 'incomum', cost: 150, damage: 10, cooldown: 2.0, range: 40, icon: '🛡️' },
            guerreiro: { id: 'guerreiro', name: 'Guerreiro', rarity: 'raro', cost: 300, damage: 15, cooldown: 3.0, range: 70, icon: '⚔️' },
            arqueiro: { id: 'arqueiro', name: 'Arqueiro', rarity: 'raro', cost: 300, damage: 8, cooldown: 4.0, range: 250, icon: '🏹' },
            ladino: { id: 'ladino', name: 'Ladino', rarity: 'epico', cost: 450, damage: 7.5, cooldown: 0.5, range: 100, icon: '🗡️' },
            clero: { id: 'clero', name: 'Clero', rarity: 'epico', cost: 200, damage: 0, cooldown: 1.0, range: 0, icon: '✝️', goldPerRound: 100 },
            mago: { id: 'mago', name: 'Mago', rarity: 'lendario', cost: 750, damage: 50, cooldown: 1.5, range: 150, icon: '🧙' },
            rei: { id: 'rei', name: 'Rei', rarity: 'mitico', cost: 2500, damage: 0, cooldown: 25.0, range: 0, icon: '👑', spawnsHorses: true },
            dragao: { id: 'dragao', name: 'Dragão Carmesim', rarity: 'secreto', cost: 5000, damage: 500, cooldown: 5.0, range: 400, icon: '🐉' }
        };

        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        let gold = 600;
        let lives = 20;
        let wave = 1;
        let selectedUnitKey = null;
        let waveInProgress = false;

        const path = [
            {x: 0, y: 300},
            {x: 200, y: 300},
            {x: 200, y: 120},
            {x: 500, y: 120},
            {x: 500, y: 480},
            {x: 680, y: 480},
            {x: 680, y: 300},
            {x: 800, y: 300}
        ];

        let towers = [];
        let enemies = [];
        let projectiles = [];
        let horses = [];
        let effects = [];

        let lastTime = performance.now();

        // Renderizar Loja
        const shopContainer = document.getElementById('shop-container');
        Object.keys(UNITS).forEach(key => {
            const u = UNITS[key];
            const card = document.createElement('div');
            card.className = `unit-card rarity-${u.rarity}`;
            card.dataset.key = key;

            let desc = `💥 ${u.damage} | ⏳ ${u.cooldown}s | 🎯 ${u.range}`;
            if (u.id === 'bardo') desc = `Aura Cooldown: -10% | 🎯 ${u.range}`;
            if (u.id === 'clero') desc = `💰 +$100 por rodada`;
            if (u.id === 'rei') desc = `🐎 Invoca Cavalo (2000 HP / 25s)`;

            card.innerHTML = `
                <div class="unit-info">
                    <div class="unit-icon">${u.icon}</div>
                    <div class="unit-details">
                        <div class="unit-name">${u.name}</div>
                        <div class="unit-stats">${desc}</div>
                    </div>
                </div>
                <div class="unit-price">$${u.cost}</div>
            `;

            card.addEventListener('click', () => {
                document.querySelectorAll('.unit-card').forEach(c => c.classList.remove('selected'));
                if (selectedUnitKey === key) {
                    selectedUnitKey = null;
                } else {
                    selectedUnitKey = key;
                    card.classList.add('selected');
                }
            });

            shopContainer.appendChild(card);
        });

        document.getElementById('btn-cancel').addEventListener('click', () => {
            selectedUnitKey = null;
            document.querySelectorAll('.unit-card').forEach(c => c.classList.remove('selected'));
        });

        document.getElementById('btn-wave').addEventListener('click', () => {
            if (!waveInProgress) {
                startWave();
            }
        });

        function startWave() {
            waveInProgress = true;
            let count = 5 + wave * 3;
            let hp = 10 + Math.pow(wave - 1, 1.8) * 10;

            let spawned = 0;
            let interval = setInterval(() => {
                enemies.push({
                    x: path[0].x,
                    y: path[0].y,
                    pathIndex: 0,
                    hp: hp,
                    maxHp: hp,
                    speed: 1.2 + Math.min(wave * 0.05, 1.5),
                    radius: 12
                });
                spawned++;
                if (spawned >= count) {
                    clearInterval(interval);
                }
            }, 1000);
        }

        function endWave() {
            waveInProgress = false;
            // Bônus do Clero
            towers.forEach(t => {
                if (t.id === 'clero') {
                    gold += 100;
                    effects.push({x: t.x, y: t.y - 15, text: '+$100', color: '#eab308', alpha: 1});
                }
            });
            gold += 50 + wave * 10;
            wave++;
            updateUI();
        }

        function updateUI() {
            document.getElementById('gold-display').innerText = Math.floor(gold);
            document.getElementById('lives-display').innerText = lives;
            document.getElementById('wave-display').innerText = wave;
        }

        canvas.addEventListener('click', (e) => {
            if (!selectedUnitKey) return;

            const rect = canvas.getBoundingClientRect();
            const x = e.clientX - rect.left;
            const y = e.clientY - rect.top;

            const unitData = UNITS[selectedUnitKey];

            if (gold < unitData.cost) return;

            // Verificar se está muito perto do caminho
            for (let i = 0; i < path.length - 1; i++) {
                const dist = pointToSegmentDistance(x, y, path[i].x, path[i].y, path[i+1].x, path[i+1].y);
                if (dist < 25) return;
            }

            // Colocar torre
            towers.push({
                ...unitData,
                x: x,
                y: y,
                lastShot: 0,
                horseTimer: 0
            });

            gold -= unitData.cost;
            updateUI();

            if (!e.shiftKey) {
                selectedUnitKey = null;
                document.querySelectorAll('.unit-card').forEach(c => c.classList.remove('selected'));
            }
        });

        let mousePos = {x: 0, y: 0};
        canvas.addEventListener('mousemove', (e) => {
            const rect = canvas.getBoundingClientRect();
            mousePos = {
                x: e.clientX - rect.left,
                y: e.clientY - rect.top
            };
        });

        function pointToSegmentDistance(px, py, x1, y1, x2, y2) {
            const l2 = (x2 - x1)*(x2 - x1) + (y2 - y1)*(y2 - y1);
            if (l2 === 0) return Math.hypot(px - x1, py - y1);
            let t = ((px - x1)*(x2 - x1) + (py - y1)*(y2 - y1)) / l2;
            t = Math.max(0, Math.min(1, t));
            return Math.hypot(px - (x1 + t*(x2 - x1)), py - (y1 + t*(y2 - y1)));
        }

        function gameLoop(time) {
            const dt = (time - lastTime) / 1000;
            lastTime = time;

            update(dt);
            render();

            requestAnimationFrame(gameLoop);
        }

        function update(dt) {
            // Atualizar Torres
            towers.forEach(t => {
                // Cálculo de buff do Bardo
                let cooldownReduction = 0;
                if (t.id !== 'bardo' && t.id !== 'clero' && t.id !== 'rei') {
                    towers.forEach(bardo => {
                        if (bardo.id === 'bardo') {
                            const dist = Math.hypot(t.x - bardo.x, t.y - bardo.y);
                            if (dist <= bardo.range) {
                                cooldownReduction = 0.10; // 10%
                            }
                        }
                    });
                }

                const effectiveCooldown = t.cooldown * (1 - cooldownReduction);

                // Mecânica do Rei
                if (t.id === 'rei') {
                    t.horseTimer = (t.horseTimer || 0) + dt;
                    if (t.horseTimer >= 25) {
                        t.horseTimer = 0;
                        horses.push({
                            x: path[path.length - 2].x,
                            y: path[path.length - 2].y,
                            pathIndex: path.length - 2,
                            hp: 2000,
                            maxHp: 2000,
                            speed: 2.0
                        });
                        effects.push({x: t.x, y: t.y - 15, text: '🐎 Cavalo Invocado!', color: '#eab308', alpha: 1});
                    }
                    return;
                }

                if (t.damage <= 0) return;

                t.lastShot += dt;
                if (t.lastShot >= effectiveCooldown) {
                    // Encontrar alvo
                    let target = null;
                    let maxProgress = -1;

                    enemies.forEach(e => {
                        const dist = Math.hypot(e.x - t.x, e.y - t.y);
                        if (dist <= t.range) {
                            const progress = e.pathIndex + (1 - Math.hypot(e.x - path[e.pathIndex+1].x, e.y - path[e.pathIndex+1].y)/100);
                            if (progress > maxProgress) {
                                maxProgress = progress;
                                target = e;
                            }
                        }
                    });

                    if (target) {
                        t.lastShot = 0;
                        projectiles.push({
                            x: t.x,
                            y: t.y,
                            target: target,
                            speed: 400,
                            damage: t.damage,
                            color: t.rarity === 'secreto' ? '#dc2626' : (t.rarity === 'lendario' ? '#f59e0b' : '#ffffff')
                        });
                    }
                }
            });

            // Atualizar Projéteis
            for (let i = projectiles.length - 1; i >= 0; i--) {
                const p = projectiles[i];
                if (!enemies.includes(p.target)) {
                    projectiles.splice(i, 1);
                    continue;
                }

                const dx = p.target.x - p.x;
                const dy = p.target.y - p.y;
                const dist = Math.hypot(dx, dy);

                if (dist < 10) {
                    p.target.hp -= p.damage;
                    projectiles.splice(i, 1);
                } else {
                    p.x += (dx / dist) * p.speed * dt;
                    p.y += (dy / dist) * p.speed * dt;
                }
            }

            // Atualizar Cavalos
            for (let i = horses.length - 1; i >= 0; i--) {
                const h = horses[i];
                const prevPoint = path[h.pathIndex];

                const dx = prevPoint.x - h.x;
                const dy = prevPoint.y - h.y;
                const dist = Math.hypot(dx, dy);

                if (dist < 5) {
                    h.pathIndex--;
                    if (h.pathIndex < 0) {
                        horses.splice(i, 1);
                        continue;
                    }
                } else {
                    h.x += (dx / dist) * h.speed;
                    h.y += (dy / dist) * h.speed;
                }

                // Colisão com Goblins
                for (let j = enemies.length - 1; j >= 0; j--) {
                    const e = enemies[j];
                    const eDist = Math.hypot(e.x - h.x, e.y - h.y);
                    if (eDist < 20) {
                        const damageDealt = Math.min(h.hp, e.hp);
                        e.hp -= damageDealt;
                        h.hp -= damageDealt;

                        if (h.hp <= 0) {
                            horses.splice(i, 1);
                            break;
                        }
                    }
                }
            }

            // Atualizar Inimigos
            for (let i = enemies.length - 1; i >= 0; i--) {
                const e = enemies[i];

                if (e.hp <= 0) {
                    gold += 12 + wave;
                    updateUI();
                    enemies.splice(i, 1);
                    continue;
                }

                const nextPoint = path[e.pathIndex + 1];
                const dx = nextPoint.x - e.x;
                const dy = nextPoint.y - e.y;
                const dist = Math.hypot(dx, dy);

                if (dist < 5) {
                    e.pathIndex++;
                    if (e.pathIndex >= path.length - 1) {
                        lives--;
                        updateUI();
                        enemies.splice(i, 1);
                        if (lives <= 0) {
                            alert("Fim de Jogo! Os Goblins invadiram o Castelo!");
                            document.location.reload();
                        }
                        continue;
                    }
                } else {
                    e.x += (dx / dist) * e.speed;
                    e.y += (dy / dist) * e.speed;
                }
            }

            // Atualizar Efeitos flutuantes
            for (let i = effects.length - 1; i >= 0; i--) {
                const ef = effects[i];
                ef.y -= 10 * dt;
                ef.alpha -= 0.8 * dt;
                if (ef.alpha <= 0) effects.splice(i, 1);
            }

            // Checar Fim de Onda
            if (waveInProgress && enemies.length === 0) {
                endWave();
            }
        }

        function render() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // Desenhar Caminho
            ctx.strokeStyle = '#8d6e63';
            ctx.lineWidth = 40;
            ctx.lineCap = 'round';
            ctx.lineJoin = 'round';
            ctx.beginPath();
            path.forEach((p, index) => {
                if (index === 0) ctx.moveTo(p.x, p.y);
                else ctx.lineTo(p.x, p.y);
            });
            ctx.stroke();

            // Borda do Caminho
            ctx.strokeStyle = '#5d4037';
            ctx.lineWidth = 44;
            ctx.globalCompositeOperation = 'destination-over';
            ctx.beginPath();
            path.forEach((p, index) => {
                if (index === 0) ctx.moveTo(p.x, p.y);
                else ctx.lineTo(p.x, p.y);
            });
            ctx.stroke();
            ctx.globalCompositeOperation = 'source-over';

            // Desenhar Castelo (Visto de Cima / Top-down)
            drawCastleTopDown();

            // Desenhar Alcance na prévia de compra
            if (selectedUnitKey) {
                const unit = UNITS[selectedUnitKey];
                ctx.beginPath();
                ctx.arc(mousePos.x, mousePos.y, unit.range, 0, Math.PI * 2);
                ctx.fillStyle = 'rgba(255, 255, 255, 0.15)';
                ctx.fill();
                ctx.strokeStyle = 'white';
                ctx.lineWidth = 1;
                ctx.stroke();
            }

            // Desenhar Auras de Bardo
            towers.forEach(t => {
                if (t.id === 'bardo') {
                    ctx.beginPath();
                    ctx.arc(t.x, t.y, t.range, 0, Math.PI * 2);
                    ctx.fillStyle = 'rgba(34, 197, 94, 0.1)';
                    ctx.fill();
                    ctx.strokeStyle = 'rgba(34, 197, 94, 0.4)';
                    ctx.lineWidth = 2;
                    ctx.stroke();
                }
            });

            // Desenhar Torres
            towers.forEach(t => {
                ctx.font = '24px serif';
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.fillText(t.icon, t.x, t.y);
            });

            // Desenhar Cavalos
            horses.forEach(h => {
                ctx.font = '20px serif';
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.fillText('🐎', h.x, h.y);

                // Barra de Vida
                ctx.fillStyle = 'red';
                ctx.fillRect(h.x - 15, h.y - 18, 30, 4);
                ctx.fillStyle = '#22c55e';
                ctx.fillRect(h.x - 15, h.y - 18, (h.hp / h.maxHp) * 30, 4);
            });

            // Desenhar Inimigos (Goblins)
            enemies.forEach(e => {
                ctx.font = '22px serif';
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.fillText('👺', e.x, e.y);

                // Barra de Vida
                ctx.fillStyle = 'red';
                ctx.fillRect(e.x - 12, e.y - 16, 24, 4);
                ctx.fillStyle = '#22c55e';
                ctx.fillRect(e.x - 12, e.y - 16, Math.max(0, (e.hp / e.maxHp)) * 24, 4);
            });

            // Desenhar Projéteis
            projectiles.forEach(p => {
                ctx.beginPath();
                ctx.arc(p.x, p.y, 4, 0, Math.PI * 2);
                ctx.fillStyle = p.color;
                ctx.fill();
            });

            // Efeitos Flutuantes
            effects.forEach(ef => {
                ctx.globalAlpha = ef.alpha;
                ctx.font = 'bold 14px sans-serif';
                ctx.fillStyle = ef.color;
                ctx.fillText(ef.text, ef.x, ef.y);
                ctx.globalAlpha = 1.0;
            });
        }

        function drawCastleTopDown() {
            const cx = 730;
            const cy = 300;

            // Base principal
            ctx.fillStyle = '#4a5568';
            ctx.fillRect(cx - 50, cy - 120, 120, 240);

            // Detalhes de pedra
            ctx.fillStyle = '#2d3748';
            ctx.fillRect(cx - 45, cy - 115, 110, 230);

            // Torres dos 4 Cantos
            const towers = [
                {x: cx - 45, y: cy - 115},
                {x: cx + 55, y: cy - 115},
                {x: cx - 45, y: cy + 115},
                {x: cx + 55, y: cy + 115}
            ];

            towers.forEach(tw => {
                ctx.beginPath();
                ctx.arc(tw.x, tw.y, 25, 0, Math.PI * 2);
                ctx.fillStyle = '#718096';
                ctx.fill();
                ctx.strokeStyle = '#1a202c';
                ctx.lineWidth = 3;
                ctx.stroke();

                // Telhado/Ameias
                ctx.beginPath();
                ctx.arc(tw.x, tw.y, 15, 0, Math.PI * 2);
                ctx.fillStyle = '#4a5568';
                ctx.fill();
            });

            // Portão
            ctx.fillStyle = '#1a202c';
            ctx.fillRect(cx - 55, cy - 25, 20, 50);

            // Grade de ferro
            ctx.strokeStyle = '#a0aec0';
            ctx.lineWidth = 2;
            for(let i = cy - 20; i <= cy + 20; i += 8) {
                ctx.beginPath();
                ctx.moveTo(cx - 55, i);
                ctx.lineTo(cx - 35, i);
                ctx.stroke();
            }
        }

        updateUI();
        requestAnimationFrame(gameLoop);
