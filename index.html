<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tower Defense Medieval</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@600;800&family=Inter:wght@400;600&display=swap');
        
        body {
            font-family: 'Inter', sans-serif;
            margin: 0;
            overflow: hidden;
            background-color: #111827; /* gray-900 */
        }
        
        h1, h2, h3, .medieval-font {
            font-family: 'Cinzel', serif;
        }

        /* Animação para a raridade Mítica (arco-íris) */
        @keyframes rainbow-bg {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }
        .rainbow-gradient {
            background: linear-gradient(45deg, #ff0000, #ff7f00, #eab308, #22c55e, #3b82f6, #a855f7, #ef4444);
            background-size: 300% 300%;
            animation: rainbow-bg 4s ease infinite;
            color: white;
            text-shadow: 1px 1px 3px rgba(0,0,0,0.8);
            border-color: #fff !important;
        }

        #game-container {
            display: flex;
            align-items: center;
            justify-content: center;
            background-image: radial-gradient(circle, #0f172a, #020617);
        }

        canvas {
            background-color: #166534; /* Grama verde */
            box-shadow: 0 0 20px rgba(0,0,0,0.5);
            max-width: 100%;
            max-height: 100%;
            aspect-ratio: 1024 / 768;
            cursor: crosshair;
        }

        .tower-card {
            transition: all 0.2s ease-in-out;
            user-select: none;
        }
        
        .tower-card:hover {
            transform: scale(1.02);
            filter: brightness(1.1);
        }

        .tower-card.disabled {
            opacity: 0.5;
            cursor: not-allowed;
            filter: grayscale(0.8);
        }

        .tower-card.selected {
            outline: 4px solid #fff;
            box-shadow: 0 0 15px rgba(255,255,255,0.6);
            transform: scale(1.05);
        }

        /* Custom scrollbar para a loja */
        ::-webkit-scrollbar {
            width: 8px;
        }
        ::-webkit-scrollbar-track {
            background: #1f2937; 
        }
        ::-webkit-scrollbar-thumb {
            background: #4b5563; 
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #6b7280; 
        }
    </style>
</head>
<body class="text-white select-none">

<div class="flex h-screen w-full">
    <!-- Área do Jogo (Canvas) -->
    <div id="game-container" class="flex-1 relative">
        <canvas id="gameCanvas" width="1024" height="768"></canvas>
        
        <!-- Tela de Fim de Jogo -->
        <div id="game-over" class="absolute inset-0 bg-black bg-opacity-80 flex flex-col items-center justify-center hidden z-50">
            <h1 class="text-6xl text-red-500 font-bold mb-4 medieval-font">O Reino Caiu!</h1>
            <p class="text-xl mb-8">Os goblins dominararam a base.</p>
            <button onclick="location.reload()" class="bg-yellow-600 hover:bg-yellow-500 text-black px-8 py-3 rounded text-xl font-bold medieval-font shadow-lg transition">Jogar Novamente</button>
        </div>
    </div>

    <!-- Painel Lateral / Loja -->
    <div class="w-80 bg-gray-900 border-l border-gray-700 flex flex-col h-full shadow-2xl z-10">
        <div class="p-4 border-b border-gray-700 bg-gray-800">
            <h1 class="text-3xl text-center mb-3 text-yellow-500 medieval-font drop-shadow-md">Defesa Real</h1>
            <div class="flex justify-between font-bold text-xl px-2">
                <span class="text-yellow-400 drop-shadow">💰 $<span id="ui-money">250</span></span>
                <span class="text-red-400 drop-shadow">❤️ <span id="ui-lives">20</span></span>
            </div>
            <div class="flex justify-between items-center mt-4 px-2">
                <span class="text-gray-300 font-bold text-lg">Rodada: <span id="ui-wave" class="text-white">1</span></span>
                <button id="btn-start" class="bg-blue-600 hover:bg-blue-500 px-4 py-2 rounded text-white font-bold transition shadow" onclick="startWave()">Iniciar Batalha</button>
            </div>
        </div>
        
        <div class="p-2 text-center text-sm text-gray-400 italic border-b border-gray-700 bg-gray-800">
            Selecione uma tropa e clique no campo para posicionar.
        </div>
        
        <div id="shop-container" class="flex-1 overflow-y-auto p-3 space-y-3 bg-gray-900 pb-10">
            <!-- Cards injetados pelo JavaScript -->
        </div>
    </div>
</div>

<script>
    // --- CONSTANTES E DADOS ---
    const RANGE_MULTIPLIER = 15; // Fator de escala para os alcances solicitados

    const RARITIES = {
        'Comum': { color: '#9ca3af', bgClass: 'bg-gray-500 text-white', border: 'border-gray-400' },
        'Incomum': { color: '#22c55e', bgClass: 'bg-green-600 text-white', border: 'border-green-400' },
        'Raro': { color: '#3b82f6', bgClass: 'bg-blue-600 text-white', border: 'border-blue-400' },
        'Épico': { color: '#a855f7', bgClass: 'bg-purple-600 text-white', border: 'border-purple-400' },
        'Lendário': { color: '#eab308', bgClass: 'bg-yellow-500 text-black', border: 'border-yellow-300' },
        'Mítico': { color: '#ec4899', bgClass: 'rainbow-gradient text-white', border: 'border-white' },
        'Secreto': { color: '#ef4444', bgClass: 'bg-red-700 text-white', border: 'border-red-400' }
    };

    const TOWER_TYPES = [
        { name: 'Camponês', rarity: 'Comum', damage: 2, cooldown: 1.0, range: 5, cost: 50, emoji: '🧑‍‍🌾', desc: 'Ataque simples corpo a corpo.' },
        { name: 'Bardo', rarity: 'Incomum', damage: 0, cooldown: 0, range: 10, cost: 150, emoji: '🎸', desc: 'Reduz 10% do tempo de recarga de aliados no alcance.' },
        { name: 'Cavaleiro', rarity: 'Incomum', damage: 10, cooldown: 2.0, range: 4, cost: 150, emoji: '🛡️', desc: 'Lutador robusto com recarga de 2s.' },
        { name: 'Guerreiro', rarity: 'Raro', damage: 15, cooldown: 3.0, range: 7, cost: 300, emoji: '⚔️', desc: 'Dano alto com recarga de 3s.' },
        { name: 'Arqueiro', rarity: 'Raro', damage: 5, cooldown: 4.0, range: 25, cost: 300, emoji: '🏹', desc: 'Longo alcance com recarga de 4s.' },
        { name: 'Ladino', rarity: 'Épico', damage: 7.5, cooldown: 0.5, range: 10, cost: 500, emoji: '🗡️', desc: 'Ataque furtivo ultra rápido de 0.5s.' },
        { name: 'Clero', rarity: 'Épico', damage: 0, cooldown: 0, range: 0, cost: 200, emoji: '⛪', desc: 'Gera $100 de ouro extra ao fim de cada rodada.' },
        { name: 'Mago', rarity: 'Lendário', damage: 30, cooldown: 1.5, range: 15, cost: 1200, emoji: '🧙', desc: 'Dispara magia poderosa a cada 1.5s.' },
        { name: 'Rei', rarity: 'Mítico', damage: 0, cooldown: 0, range: 0, cost: 3000, emoji: '👑', desc: 'Invoca cavalos com 2000 PV na pista a cada 25s.' },
        { name: 'Dragão Carmesim', rarity: 'Secreto', damage: 500, cooldown: 5.0, range: 40, cost: 10000, emoji: '🐉', desc: 'A lenda. Dano de 500 a cada 5s.' },
    ];

    // --- VARIÁVEIS DE ESTADO ---
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    
    let lastTime = 0;
    let state = {
        money: 200,
        lives: 20,
        wave: 1,
        waveActive: false,
        goblinsToSpawn: 0,
        spawnTimer: 0,
        placingTowerIndex: null,
        gameOver: false
    };

    let towers = [];
    let goblins = [];
    let projectiles = [];
    let horses = [];
    let floatingTexts = [];

    // Caminho percorrido pelos goblins (em proporção ao tamanho do canvas)
    const pathPoints = [
        {x: 0.0, y: 0.15},
        {x: 0.2, y: 0.15},
        {x: 0.2, y: 0.85},
        {x: 0.5, y: 0.85},
        {x: 0.5, y: 0.4},
        {x: 0.8, y: 0.4},
        {x: 0.8, y: 0.75},
        {x: 1.0, y: 0.75}
    ];
    
    // Mapeando caminho lógico para pixels baseando-se no tamanho fixo do canvas 1024x768
    const path = pathPoints.map(p => ({ x: p.x * canvas.width, y: p.y * canvas.height }));

    const shopContainer = document.getElementById('shop-container');
    const uiMoney = document.getElementById('ui-money');
    const uiLives = document.getElementById('ui-lives');
    const uiWave = document.getElementById('ui-wave');
    const btnStart = document.getElementById('btn-start');

    function renderShop() {
        shopContainer.innerHTML = '';
        TOWER_TYPES.forEach((tower, index) => {
            const card = document.createElement('div');
            
            // Formatando o tempo de recarga para texto
            let atkText = tower.cooldown > 0 ? `${tower.cooldown}s` : '--';
            let dmgText = tower.damage > 0 ? tower.damage : '--';
            let rangeText = tower.range > 0 ? tower.range : '--';
            
            card.className = `tower-card p-3 rounded-lg border-2 cursor-pointer shadow-md flex flex-col ${RARITIES[tower.rarity].bgClass} ${RARITIES[tower.rarity].border}`;
            card.id = `card-${index}`;
            card.innerHTML = `
                <div class="flex justify-between items-center mb-1">
                    <span class="font-bold text-lg medieval-font">${tower.emoji} ${tower.name}</span>
                    <span class="font-black bg-black bg-opacity-40 px-2 py-0.5 rounded">$${tower.cost}</span>
                </div>
                <div class="text-xs uppercase font-bold opacity-80 mb-1">${tower.rarity}</div>
                <div class="text-xs opacity-90 mb-2 leading-tight">${tower.desc}</div>
                <div class="flex justify-between text-xs bg-black bg-opacity-20 p-1 rounded font-mono">
                    <span title="Dano">⚔️ ${dmgText}</span>
                    <span title="Tempo de Recarga">⏳ ${atkText}</span>
                    <span title="Alcance">🎯 ${rangeText}</span>
                </div>
            `;
            
            card.onclick = () => selectTower(index);
            shopContainer.appendChild(card);
        });
        updateShopUI();
    }

    function updateShopUI() {
        uiMoney.innerText = state.money;
        uiLives.innerText = state.lives;
        uiWave.innerText = state.wave;
        
        TOWER_TYPES.forEach((tower, index) => {
            const card = document.getElementById(`card-${index}`);
            if (!card) return;
            
            if (state.money < tower.cost) {
                card.classList.add('disabled');
            } else {
                card.classList.remove('disabled');
            }
            
            if (state.placingTowerIndex === index) {
                card.classList.add('selected');
            } else {
                card.classList.remove('selected');
            }
        });
    }

    function selectTower(index) {
        if (state.money >= TOWER_TYPES[index].cost) {
            if (state.placingTowerIndex === index) {
                state.placingTowerIndex = null; // Deselect
            } else {
                state.placingTowerIndex = index;
            }
            updateShopUI();
        }
    }

    class Tower {
        constructor(x, y, typeIndex) {
            this.x = x;
            this.y = y;
            this.typeIndex = typeIndex;
            this.data = TOWER_TYPES[typeIndex];
            
            this.cooldown = 0;
            this.horseTimer = 0; // Para o Rei
            this.bardsInRange = 0; // Quantos bardos estão buffando esta torre
        }

        update(dt) {
            // Lógica do Rei (Mítico): Invoca Cavalos
            if (this.data.name === 'Rei') {
                this.horseTimer += dt;
                if (this.horseTimer >= 25) { // a cada 25 segundos
                    this.horseTimer = 0;
                    horses.push(new Horse());
                    createFloatingText(this.x, this.y, "Cavalo Invocado!", "#eab308");
                }
                return;
            }

            // Torres sem ataque (Bardo, Clero)
            if (this.data.cooldown === 0) return;

            this.cooldown -= dt;
            if (this.cooldown <= 0) {
                let target = this.findTarget();
                if (target) {
                    // Cálculo de tempo de recarga com buff dos Bardos (10% de redução por bardo)
                    let baseCooldown = this.data.cooldown;
                    let multiplier = Math.pow(0.9, this.bardsInRange);
                    // Limita o buff a 50% de redução máxima
                    if (multiplier < 0.5) multiplier = 0.5; 
                    
                    this.cooldown = baseCooldown * multiplier;
                    
                    // Dispara
                    projectiles.push(new Projectile(this.x, this.y, target, this.data));
                }
            }
        }

        findTarget() {
            let rangePx = this.data.range * RANGE_MULTIPLIER;
            for (let g of goblins) {
                let dist = Math.hypot(g.x - this.x, g.y - this.y);
                if (dist <= rangePx) {
                    return g; // Retorna o primeiro goblin que entrar no alcance
                }
            }
            return null;
        }

        draw() {
            ctx.beginPath();
            ctx.arc(this.x, this.y, 20, 0, Math.PI * 2);
            ctx.fillStyle = RARITIES[this.data.rarity].color;
            ctx.fill();
            ctx.strokeStyle = '#fff';
            ctx.lineWidth = 2;
            ctx.stroke();

            // Emoji
            ctx.font = '24px Arial';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText(this.data.emoji, this.x, this.y + 2);
            
            // Aura especial para classes suporte ou mágicas
            if (this.data.name === 'Bardo') {
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.data.range * RANGE_MULTIPLIER, 0, Math.PI * 2);
                ctx.strokeStyle = 'rgba(34, 197, 94, 0.15)';
                ctx.lineWidth = 2;
                ctx.stroke();
            } else if (this.data.name === 'Rei') {
                ctx.shadowBlur = 15;
                ctx.shadowColor = "yellow";
                ctx.beginPath();
                ctx.arc(this.x, this.y, 25, 0, Math.PI * 2);
                ctx.strokeStyle = 'rgba(255, 215, 0, 0.6)';
                ctx.lineWidth = 3;
                ctx.stroke();
                ctx.shadowBlur = 0;
            }
        }
    }

    class Goblin {
        constructor(hp, speed, reward) {
            this.x = path[0].x;
            this.y = path[0].y;
            this.hp = hp;
            this.maxHp = hp;
            this.speed = speed;
            this.reward = reward;
            this.waypoint = 1;
            this.emoji = ['👺', '👹', '🧟', '🧌'][Math.floor(Math.random()*4)];
        }

        update(dt) {
            let target = path[this.waypoint];
            let dx = target.x - this.x;
            let dy = target.y - this.y;
            let dist = Math.hypot(dx, dy);
            
            let move = this.speed * dt;
            if (dist < move) {
                this.x = target.x;
                this.y = target.y;
                this.waypoint++;
                if (this.waypoint >= path.length) {
                    return false; // Chegou ao fim (Tira vida)
                }
            } else {
                this.x += (dx / dist) * move;
                this.y += (dy / dist) * move;
            }
            return true;
        }

        draw() {
            ctx.font = '22px Arial';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText(this.emoji, this.x, this.y);
            
            // Barra de vida
            ctx.fillStyle = '#ef4444';
            ctx.fillRect(this.x - 12, this.y - 20, 24, 4);
            ctx.fillStyle = '#22c55e';
            let hpRatio = Math.max(0, this.hp / this.maxHp);
            ctx.fillRect(this.x - 12, this.y - 20, 24 * hpRatio, 4);
        }
    }

    class Horse {
        constructor() {
            this.hp = 2000;
            this.maxHp = 2000;
            this.waypoint = path.length - 1; // Nasce na base (último ponto)
            this.x = path[this.waypoint].x;
            this.y = path[this.waypoint].y;
            this.speed = 60; // Movimento contínuo contra os goblins
        }

        update(dt) {
            let target = path[this.waypoint - 1]; // Move para trás
            if (!target) return false; // Chegou no início do mapa e some

            let dx = target.x - this.x;
            let dy = target.y - this.y;
            let dist = Math.hypot(dx, dy);
            
            let move = this.speed * dt;
            if (dist < move) {
                this.x = target.x;
                this.y = target.y;
                this.waypoint--;
                if (this.waypoint <= 0) return false;
            } else {
                this.x += (dx / dist) * move;
                this.y += (dy / dist) * move;
            }
            return true;
        }

        draw() {
            ctx.font = '28px Arial';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            // Vira o emoji dependendo da direção
            ctx.save();
            ctx.translate(this.x, this.y);
            ctx.scale(-1, 1); // Cavalos correm da direita pra esquerda geralmente
            ctx.fillText('🐎', 0, 0);
            ctx.restore();

            // Vida do Cavalo
            ctx.fillStyle = '#ef4444';
            ctx.fillRect(this.x - 15, this.y - 25, 30, 5);
            ctx.fillStyle = '#eab308';
            let hpRatio = Math.max(0, this.hp / this.maxHp);
            ctx.fillRect(this.x - 15, this.y - 25, 30 * hpRatio, 5);
        }
    }

    class Projectile {
        constructor(x, y, target, towerData) {
            this.x = x;
            this.y = y;
            this.target = target;
            this.damage = towerData.damage;
            this.speed = 400; // pixels/s
            this.type = towerData.name;
            
            // Grava último alvo caso o inimigo morra antes de acertar
            this.targetX = target.x;
            this.targetY = target.y;
        }

        update(dt) {
            if (goblins.includes(this.target)) {
                this.targetX = this.target.x;
                this.targetY = this.target.y;
            }

            let dx = this.targetX - this.x;
            let dy = this.targetY - this.y;
            let dist = Math.hypot(dx, dy);
            
            if (dist < this.speed * dt) {
                if (goblins.includes(this.target)) {
                    this.target.hp -= this.damage;
                    createFloatingText(this.target.x, this.target.y - 10, `-${this.damage}`, '#ffeda8');
                    
                    if (this.target.hp <= 0) {
                        state.money += this.target.reward;
                        let idx = goblins.indexOf(this.target);
                        if (idx > -1) goblins.splice(idx, 1);
                        updateShopUI();
                    }
                }
                return false; // Impacto, deletar projétil
            }
            this.x += (dx / dist) * this.speed * dt;
            this.y += (dy / dist) * this.speed * dt;
            return true;
        }

        draw() {
            ctx.beginPath();
            if (this.type === 'Dragão Carmesim') {
                ctx.font = '20px Arial'; ctx.fillText('🔥', this.x, this.y);
            } else if (this.type === 'Arqueiro') {
                ctx.font = '14px Arial'; ctx.fillText('🏹', this.x, this.y);
            } else if (this.type === 'Mago') {
                ctx.font = '16px Arial'; ctx.fillText('✨', this.x, this.y);
            } else {
                ctx.arc(this.x, this.y, 4, 0, Math.PI * 2);
                ctx.fillStyle = '#fef08a';
                ctx.fill();
            }
        }
    }

    function createFloatingText(x, y, text, color) {
        floatingTexts.push({ x: x, y: y, text: text, color: color, life: 1.0 });
    }

    function pointToSegmentDist(px, py, x1, y1, x2, y2) {
        let A = px - x1, B = py - y1, C = x2 - x1, D = y2 - y1;
        let dot = A * C + B * D;
        let len_sq = C * C + D * D;
        let param = -1;
        if (len_sq != 0) param = dot / len_sq;
        let xx, yy;
        if (param < 0) { xx = x1; yy = y1; }
        else if (param > 1) { xx = x2; yy = y2; }
        else { xx = x1 + param * C; yy = y1 + param * D; }
        let dx = px - xx, dy = py - yy;
        return Math.sqrt(dx * dx + dy * dy);
    }

    function canPlaceTower(x, y) {
        // Distância borda
        if (x < 25 || x > canvas.width - 25 || y < 25 || y > canvas.height - 25) return false;
        
        // Distância do caminho (largura do caminho é ~40, torre raio ~20)
        let minPathDist = 35;
        for (let i = 0; i < path.length - 1; i++) {
            if (pointToSegmentDist(x, y, path[i].x, path[i].y, path[i+1].x, path[i+1].y) < minPathDist) return false;
        }

        // Distância de outras torres
        for (let t of towers) {
            if (Math.hypot(t.x - x, t.y - y) < 45) return false;
        }
        return true;
    }

    function getMousePos(evt) {
        let rect = canvas.getBoundingClientRect();
        let scaleX = canvas.width / rect.width;
        let scaleY = canvas.height / rect.height;
        return {
            x: (evt.clientX - rect.left) * scaleX,
            y: (evt.clientY - rect.top) * scaleY
        };
    }

    let mousePos = {x: 0, y: 0};
    canvas.addEventListener('mousemove', (e) => { mousePos = getMousePos(e); });
    
    canvas.addEventListener('click', (e) => {
        if (state.placingTowerIndex !== null) {
            let pos = getMousePos(e);
            let towerData = TOWER_TYPES[state.placingTowerIndex];
            
            if (canPlaceTower(pos.x, pos.y) && state.money >= towerData.cost) {
                state.money -= towerData.cost;
                towers.push(new Tower(pos.x, pos.y, state.placingTowerIndex));
                updateBardsAura(); // Recalcula buffs
                state.placingTowerIndex = null;
                updateShopUI();
            } else {
                // Efeito visual de erro?
                createFloatingText(pos.x, pos.y, "Espaço Inválido!", "#ef4444");
            }
        }
    });

    function updateBardsAura() {
        towers.forEach(t => {
            t.bardsInRange = 0;
            if (t.data.name !== 'Bardo' && t.data.name !== 'Clero' && t.data.name !== 'Rei') {
                towers.forEach(other => {
                    if (other.data.name === 'Bardo') {
                        if (Math.hypot(t.x - other.x, t.y - other.y) <= other.data.range * RANGE_MULTIPLIER) {
                            t.bardsInRange++;
                        }
                    }
                });
            }
        });
    }

    function startWave() {
        if (state.waveActive || state.gameOver) return;
        state.waveActive = true;
        // Goblins escalam na dificuldade
        state.goblinsToSpawn = 5 + state.wave * 3;
        state.spawnTimer = 0;
        
        btnStart.classList.add('opacity-50', 'cursor-not-allowed');
        btnStart.innerText = "Em Batalha...";
    }

    function endWave() {
        state.waveActive = false;
        state.wave++;
        
        // Habilidade especial do Clero (+100 por round por clero)
        let clerics = towers.filter(t => t.data.name === 'Clero').length;
        if (clerics > 0) {
            let bonus = clerics * 100;
            state.money += bonus;
            
            // Efeito visual nos cleros
            towers.forEach(t => {
                if (t.data.name === 'Clero') {
                    createFloatingText(t.x, t.y - 20, "+$100 (Bênção)", "#fcd34d");
                }
            });
        }
        
        btnStart.classList.remove('opacity-50', 'cursor-not-allowed');
        btnStart.innerText = "Iniciar Batalha";
        updateShopUI();
    }

    function drawMap() {
        // Limpar fundo
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        
        // Caminho
        ctx.lineWidth = 45;
        ctx.lineCap = 'round';
        ctx.lineJoin = 'round';
        ctx.strokeStyle = '#854d0e'; // Marrom estrada
        ctx.beginPath();
        ctx.moveTo(path[0].x, path[0].y);
        for(let i=1; i<path.length; i++) {
            ctx.lineTo(path[i].x, path[i].y);
        }
        ctx.stroke();

        // Linha interna para dar textura
        ctx.lineWidth = 35;
        ctx.strokeStyle = '#a16207';
        ctx.stroke();
    }

    function gameLoop(timestamp) {
        if (!lastTime) lastTime = timestamp;
        let dt = (timestamp - lastTime) / 1000;
        lastTime = timestamp;
        
        // Limite de delta time em caso de travamentos da aba
        if (dt > 0.1) dt = 0.1;

        if (!state.gameOver) {
            // Spawn de inimigos
            if (state.waveActive && state.goblinsToSpawn > 0) {
                state.spawnTimer += dt;
                if (state.spawnTimer >= 1.2) { // 1.2s entre goblins
                    state.spawnTimer = 0;
                    state.goblinsToSpawn--;
                    
                    let baseHp = 10 * Math.pow(1.3, state.wave - 1);
                    let speed = 40 + (state.wave * 2);
                    let reward = 5 + Math.floor(state.wave / 2);
                    goblins.push(new Goblin(baseHp, speed, reward));
                }
            }

            // Update Torres
            towers.forEach(t => t.update(dt));

            // Update Goblins
            for (let i = goblins.length - 1; i >= 0; i--) {
                if (!goblins[i].update(dt)) {
                    // Goblin vazou
                    goblins.splice(i, 1);
                    state.lives--;
                    updateShopUI();
                    if (state.lives <= 0) {
                        state.gameOver = true;
                        document.getElementById('game-over').classList.remove('hidden');
                    }
                }
            }

            // Update Cavalos e Colisão (O sacrifício do Rei)
            for (let h = horses.length - 1; h >= 0; h--) {
                let horse = horses[h];
                if (!horse.update(dt)) {
                    horses.splice(h, 1);
                    continue;
                }
                
                // Colisão cavalo vs goblin
                for (let g = goblins.length - 1; g >= 0; g--) {
                    let gob = goblins[g];
                    if (Math.hypot(horse.x - gob.x, horse.y - gob.y) < 30) {
                        horse.hp -= gob.hp; // Cavalo toma dano igual a vida do goblin
                        createFloatingText(gob.x, gob.y, "⚔️ Impacto!", "#fff");
                        state.money += gob.reward; // Recompensa extra pelo sacrifício!
                        goblins.splice(g, 1); // Goblin morre esmagado
                        updateShopUI();
                        
                        if (horse.hp <= 0) {
                            horses.splice(h, 1);
                            break; // Cavalo morreu, para de atropelar
                        }
                    }
                }
            }

            // Update Projéteis
            for (let i = projectiles.length - 1; i >= 0; i--) {
                if (!projectiles[i].update(dt)) {
                    projectiles.splice(i, 1);
                }
            }

            // Verifica fim de rodada
            if (state.waveActive && state.goblinsToSpawn === 0 && goblins.length === 0) {
                endWave();
            }
        }

        // Renderização
        drawMap();
        
        towers.forEach(t => t.draw());
        horses.forEach(h => h.draw());
        goblins.forEach(g => g.draw());
        projectiles.forEach(p => p.draw());

        // Desenhar preview da torre selecionada
        if (state.placingTowerIndex !== null) {
            let twData = TOWER_TYPES[state.placingTowerIndex];
            let rangePx = twData.range * RANGE_MULTIPLIER;
            let valid = canPlaceTower(mousePos.x, mousePos.y) && state.money >= twData.cost;
            
            ctx.beginPath();
            ctx.arc(mousePos.x, mousePos.y, rangePx, 0, Math.PI*2);
            ctx.fillStyle = valid ? 'rgba(255, 255, 255, 0.15)' : 'rgba(239, 68, 68, 0.2)';
            ctx.fill();
            ctx.lineWidth = 1;
            ctx.strokeStyle = valid ? '#fff' : '#ef4444';
            ctx.stroke();

            ctx.globalAlpha = 0.6;
            ctx.beginPath();
            ctx.arc(mousePos.x, mousePos.y, 20, 0, Math.PI * 2);
            ctx.fillStyle = RARITIES[twData.rarity].color;
            ctx.fill();
            ctx.font = '24px Arial';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText(twData.emoji, mousePos.x, mousePos.y + 2);
            ctx.globalAlpha = 1.0;
        }

        // Efeitos de texto flutuante
        for (let i = floatingTexts.length - 1; i >= 0; i--) {
            let ft = floatingTexts[i];
            ft.life -= dt;
            ft.y -= 20 * dt; // Sobem lentamente
            if (ft.life <= 0) {
                floatingTexts.splice(i, 1);
            } else {
                ctx.globalAlpha = ft.life;
                ctx.fillStyle = ft.color;
                ctx.font = 'bold 18px Arial';
                ctx.textAlign = 'center';
                ctx.strokeStyle = '#000';
                ctx.lineWidth = 3;
                ctx.strokeText(ft.text, ft.x, ft.y);
                ctx.fillText(ft.text, ft.x, ft.y);
                ctx.globalAlpha = 1.0;
            }
        }

        requestAnimationFrame(gameLoop);
    }

    // Inicializa
    renderShop();
    requestAnimationFrame(gameLoop);

</script>
</body>
</html>
